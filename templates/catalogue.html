<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explorez notre catalogue complet d'électronique premium. RD Store - L'excellence à portée de main.">
    <title>Catalogue | RD Store</title>
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23C6A75E'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='white' font-family='serif'>C</text></svg>">
</head>
<body>
    <!-- Header -->
    <header class="header" id="header">
        <div class="header-inner">
            <!-- Logo -->
            <a href="index" class="logo">
                <div class="logo-icon">R</div>
                <span class="logo-text">RD Store</span>
            </a>
            
            <!-- Navigation -->
            <nav class="nav">
                <a href="index" class="nav-link">Accueil</a>
                <a href="catalogue" class="nav-link active">Catalogue</a>
                
                <!-- Theme Toggle -->
                <button class="theme-toggle" id="themeToggle" aria-label="Changer de thème">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                </button>
            </nav>
        </div>
    </header>

    <!-- Catalogue Section -->
    <main class="catalogue">
        <!-- Catalogue Header -->
        <div class="catalogue-header">
            <h1 class="catalogue-title">Notre Catalogue</h1>
            <p class="catalogue-count" id="productCount">Chargement...</p>
        </div>
        
        <!-- Products Grid -->
        <div class="products-grid" id="catalogueGrid">
            <!-- Products will be loaded by JavaScript -->
        </div>
        
        <!-- Loading Indicator -->
        <div class="loading-indicator" id="loadingIndicator" style="display: none;">
            <div class="loading-spinner"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-logo">
            <div class="footer-logo-icon">R</div>
            <span class="footer-logo-text">RD Store</span>
        </div>
        <p class="footer-text">© 2026 RD Store. Tous droits réservés.</p>
    </footer>

    <!-- Back to Top Button -->
    <button class="back-to-top" id="backToTop" aria-label="Retour en haut">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="18,15 12,9 6,15"/>
        </svg>
    </button>

    <!-- JavaScript -->
    <script src="js/main.js"></script>
    <script>
        // Initialize catalogue page after products are loaded
        document.addEventListener('DOMContentLoaded', () => {
            // Wait for initCatalogue to be available
            const checkInit = setInterval(() => {
                if (typeof window.initCatalogue === 'function') {
                    clearInterval(checkInit);
                    window.initCatalogue();
                }
            }, 100);
        });
    </script>
</body>
</html>
